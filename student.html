<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샌드위치 경매 CEO · Padlet 경제활동 V1.1</title><style>
:root{--bg:#eef3f8;--ink:#10223c;--muted:#40516b;--card:#fff;--line:#cad6e5;--brand:#0b7a70;--brand2:#0c5c66;--accent:#f59e0b;--blue:#2563eb;--purple:#7c3aed;--green:#15803d;--soft:#ecfdf5;--warn:#fff7ed;--danger:#b42318;--shadow:0 8px 24px rgba(16,34,60,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#0b7a70 0%,#165a72 58%,#244e77 100%);color:#fff;padding:30px 32px;border-radius:24px;margin-bottom:20px;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:38px;letter-spacing:-.6px}.hero p{margin:0;font-size:19px;opacity:.98;font-weight:700}.card{background:var(--card);border:2px solid #d5dfeb;border-radius:22px;padding:24px 26px;margin:18px 0;box-shadow:var(--shadow)}.card h2{margin:0 0 18px;font-size:30px;letter-spacing:-.4px;color:#12294b}.card h3{margin:0 0 12px;font-size:23px;color:#17385e}.section-teal{border-left:8px solid #0f8b7d}.section-orange{border-left:8px solid #f59e0b}.section-purple{border-left:8px solid #7c3aed}.section-blue{border-left:8px solid #2563eb}.section-green{border-left:8px solid #16a34a}.sectionIntro{font-size:18px;font-weight:700;color:#344a67;background:#f4f8fc;border:1px solid #d7e2ef;border-radius:14px;padding:13px 15px;margin:-5px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{margin-bottom:14px}.field label{display:block;font-size:18px;font-weight:900;margin-bottom:8px;color:#162d4c}.input,select,textarea{width:100%;padding:15px 16px;border:2px solid #8fa6c2;border-radius:14px;background:#ffffff;font-size:20px;line-height:1.55;color:#071b33!important;-webkit-text-fill-color:#071b33;opacity:1;font-weight:800;outline:none;transition:.18s}input::placeholder,textarea::placeholder{color:#66788d!important;-webkit-text-fill-color:#66788d;opacity:1;font-weight:650}select option{color:#071b33;background:#fff;font-weight:700}.input:disabled,select:disabled,textarea:disabled{color:#34465d!important;-webkit-text-fill-color:#34465d;opacity:1}.input:focus,select:focus,textarea:focus{border-color:#0f8b7d;box-shadow:0 0 0 4px rgba(15,139,125,.12);background:#fff}textarea{min-height:130px;resize:vertical;font-family:inherit}.bigarea{min-height:165px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:900;cursor:pointer;background:var(--brand);color:#fff;margin:5px;box-shadow:0 4px 10px rgba(16,34,60,.08)}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.btn.secondary{background:#2e405d}.btn.light{background:#e8f6f3;color:#075e57;border:1px solid #b6e2d9}.btn.warn{background:var(--accent);color:#2b1d05}.btn.danger{background:#d92d20}.btn:disabled{opacity:.42;cursor:not-allowed}.pill{display:inline-block;background:#e8eef6;border-radius:999px;padding:8px 12px;margin:4px;font-size:15px;font-weight:800}.notice{background:#eafaf4;border:2px solid #9ee7ca;border-radius:16px;padding:15px 17px;color:#173f34;font-size:17px}.warnbox{background:#fff5e8;border:2px solid #f7c77d;border-radius:16px;padding:15px 17px;color:#5c3b0b}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stepdot{padding:9px 13px;border-radius:999px;background:#e1e8f1;color:#30435f;font-weight:900;font-size:15px}.stepdot.on{background:#0f7d72;color:#fff;box-shadow:0 3px 8px rgba(15,125,114,.2)}.choice{display:flex;gap:10px;flex-wrap:wrap}.check{display:inline-flex;gap:8px;align-items:center;border:2px solid #ced9e7;border-radius:13px;padding:11px 13px;background:#fff;font-weight:700}.summary{white-space:pre-wrap;background:#0b2032;color:#f3fbff;border-radius:16px;padding:18px;line-height:1.7;font-size:17px}.right{text-align:right}.muted{color:#455a74;font-size:16px;font-weight:600}.money{font-size:27px;font-weight:900;color:#08766d}.error{color:var(--danger);font-weight:900}.success{color:#08783f;font-weight:900}.photo{max-width:100%;max-height:300px;border-radius:14px;border:2px solid var(--line);display:none;margin-top:10px}.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.sticky{position:sticky;bottom:0;background:rgba(238,243,248,.96);backdrop-filter:blur(7px);padding:12px 0;border-top:2px solid #d1dbe8;margin-top:18px}.miniCard{border:2px solid #d5dfeb;border-radius:16px;padding:14px;background:#fbfdff}.small{font-size:15px;color:#435872}.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 18px}.legend .lg{border-radius:14px;padding:12px 13px;font-weight:900;border:2px solid transparent}.lg.common{background:#e8f7ef;border-color:#99ddb7;color:#145a34}.lg.main{background:#fff0ed;border-color:#f3afa3;color:#8d2f22}.lg.addon{background:#fff8df;border-color:#f4d47a;color:#6a4a00}.lg.drink{background:#edf4ff;border-color:#a9c8ff;color:#174ea6}.categoryBox{border:2px solid #d6e0ec;border-radius:18px;padding:16px;background:#fbfdff}.categoryBox.mainBox{border-top:7px solid #e85d4a}.categoryBox.addonBox{border-top:7px solid #f0ad19}.categoryBox.drinkBox{border-top:7px solid #3b82f6}.tipTitle{display:inline-block;padding:6px 10px;border-radius:999px;font-size:14px;font-weight:900;margin-bottom:8px}.tipTitle.green{background:#dcfce7;color:#166534}.tipTitle.orange{background:#ffedd5;color:#9a3412}.tipTitle.purple{background:#f3e8ff;color:#6b21a8}.highlight{color:#0b766e;font-weight:900}.example{color:#684b08;background:#fff8db;border:1px dashed #e2b94f;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:16px}.buttonRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.majorLabel{font-size:20px;font-weight:900;color:#17385e;margin:8px 0}.tagline{font-size:17px;color:#334c6a;font-weight:700;margin-bottom:10px}
@media(max-width:820px){body{font-size:17px}.grid,.grid3,.legend{grid-template-columns:1fr}.hero h1{font-size:29px}.hero p{font-size:17px}.wrap{padding:12px}.card{padding:18px}.card h2{font-size:25px}.field label{font-size:18px}.input,select,textarea{font-size:19px;padding:14px}.btn{font-size:17px}}
</style></head><body><div class="wrap"><div class="hero"><h1 id="title">🥪 샌드위치 경매 CEO · 경제활동 기록</h1><p>처음 계획 → 실제 경매 결과 → 우리 조 상품 → 경제회의 → 남은 예산 → Padlet 공유까지 차례대로 기록합니다.</p></div><div class="card bar"><div><b>우리 조</b> <select id="team" style="width:auto"></select></div><div class="money" id="budgetTop"></div></div><div id="steps" class="steps"></div><div id="page"></div><div class="sticky bar"><button id="prev" class="btn light">← 이전</button><div class="muted" id="saveMsg">자동 저장</div><button id="next" class="btn">다음 →</button></div></div><script>
const DEF={"classTitle": "샌드위치 경매 CEO · 경제활동 기록", "teamCount": 5, "teamBudget": 30000, "padletUrl": "https://padlet.com/ksgi9790/live-100-s023ly7ch6vxfksxrxv0", "commonIngredients": ["식빵", "양상추/샐러드채소", "마요네즈", "케첩", "허니머스타드", "생수"], "mainItems": ["슬라이스 햄", "조리 닭가슴살", "참치", "삶은 달걀", "크래미", "감자샐러드"], "addonItems": ["슬라이스 치즈", "토마토", "오이피클", "크림치즈", "파인애플 슬라이스"], "drinkItems": ["콜라 업그레이드"], "concepts": ["희소성", "예산제약", "선택", "기회비용", "가격경쟁", "가격형성", "합리적 소비", "저축", "기부·나눔"], "stickerEnabled": true, "stickerCategories": ["먹어보고 싶어요", "재료 조합이 창의적이에요", "경제적 선택이 인상적이에요"]};const $=s=>document.querySelector(s);
function decodeCfg(){try{const raw=(location.hash.match(/cfg=([^&]+)/)||[])[1];if(!raw)return null;const s=decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/'))));return JSON.parse(s)}catch(e){return null}}
const CFG=decodeCfg()||DEF;let step=0,team=localStorage.getItem('padletEconomyTeamV1')||'1';const KEY=()=>`padletEconomyDataV1:${team}`;
function blank(){return{planName:'',wantedMain:'',wantedExtras:[],maxBid:'',planReason:'',actualMain:'',actualExtras:[],drink:'',spent:'',change:'',gaveUp:'',whyChange:'',finalName:'',salePrice:'',priceReason:'',targetCustomer:'',productLine:'',bestChoice:'',hardChoice:'',nextStrategy:'',concepts:[],consume:'0',save:'0',donate:'0',reserve:'0',sticker:{},photoName:''}}
let data=load();function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY())||'{}'))}catch(e){return blank()}}function save(){localStorage.setItem(KEY(),JSON.stringify(data));$('#saveMsg').textContent='✅ 저장됨';setTimeout(()=>$('#saveMsg').textContent='자동 저장',1200)}function money(n){return Number(n||0).toLocaleString()+'원'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function checkList(name,items,selected){return `<div class="choice">${items.map(x=>`<label class="check"><input type="checkbox" name="${name}" value="${esc(x)}" ${selected.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div>`}
function radioList(name,items,val){return `<div class="choice">${items.map(x=>`<label class="check"><input type="radio" name="${name}" value="${esc(x)}" ${val===x?'checked':''}> ${esc(x)}</label>`).join('')}</div>`}
function stepDots(){const labels=['경매 전 계획','경매 후 비교','우리 조 상품','경제회의','남은 예산','스티커','Padlet 공유'];$('#steps').innerHTML=labels.map((x,i)=>`<span class="stepdot ${i===step?'on':''}">${i+1}. ${x}</span>`).join('')}
function leftover(){return Math.max(0,Number(CFG.teamBudget)-Number(data.spent||0))}function allocTotal(){return ['consume','save','donate','reserve'].reduce((a,k)=>a+Number(data[k]||0),0)}
function page1(){return `<div class="card"><h2>① 경매 전 · 우리 조 계획</h2><div class="grid"><div class="field"><label>처음 생각한 샌드위치 이름</label><input class="input" data-k="planName" value="${esc(data.planName)}"></div><div class="field"><label>가장 원하는 메인재료</label><select class="input" data-k="wantedMain"><option value="">선택</option>${CFG.mainItems.map(x=>`<option ${data.wantedMain===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="field"><label>사고 싶은 추가재료</label>${checkList('wantedExtras',CFG.addonItems,data.wantedExtras)}</div><div class="grid"><div class="field"><label>우리 조가 생각한 최대 입찰 한도</label><input class="input" type="number" data-k="maxBid" value="${esc(data.maxBid)}" placeholder="예: 6000"></div><div class="field"><label>왜 이 재료를 선택했나요?</label><textarea data-k="planReason">${esc(data.planReason)}</textarea></div></div><div class="notice">💰 조별 가상예산은 <b>${money(CFG.teamBudget)}</b>입니다. 처음부터 전부 쓸 필요는 없습니다.</div></div>`}
function page2(){return `<div class="card"><h2>② 경매 후 · 실제 결과와 비교</h2><div class="grid"><div class="field"><label>실제 확보한 메인재료</label><select class="input" data-k="actualMain"><option value="">선택</option>${CFG.mainItems.map(x=>`<option ${data.actualMain===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>총 낙찰 지출</label><input class="input" type="number" data-k="spent" value="${esc(data.spent)}" placeholder="예: 8500"><div class="muted">남은 가상예산: <b id="leftoverAfterSpend">${money(leftover())}</b></div></div></div><div class="field"><label>실제 확보한 추가재료</label>${checkList('actualExtras',CFG.addonItems,data.actualExtras)}</div><div class="field"><label>음료/업그레이드</label>${radioList('drink',CFG.drinkItems,data.drink)}<label class="check"><input type="radio" name="drink" value="" ${!data.drink?'checked':''}> 선택하지 않음</label></div><div class="grid"><div class="field"><label>처음 계획과 무엇이 달라졌나요?</label><textarea data-k="change">${esc(data.change)}</textarea></div><div class="field"><label>포기한 재료 또는 선택은 무엇인가요?</label><textarea data-k="gaveUp">${esc(data.gaveUp)}</textarea></div></div><div class="field"><label>왜 선택을 바꾸거나 포기했나요?</label><textarea data-k="whyChange">${esc(data.whyChange)}</textarea></div></div>`}
function page3(){return `<div class="card"><h2>③ 우리 조 샌드위치를 ‘상품’으로 만들어보기</h2><div class="grid"><div class="field"><label>최종 샌드위치 이름</label><input class="input" data-k="finalName" value="${esc(data.finalName)}" placeholder="예: 제주 크래미 파인 샌드"></div><div class="field"><label>샌드위치 1개 판매가격</label><input class="input" type="number" data-k="salePrice" value="${esc(data.salePrice)}" placeholder="예: 5500"></div><div class="field"><label>누가 사 먹으면 좋을까요?</label><input class="input" data-k="targetCustomer" value="${esc(data.targetCustomer)}" placeholder="예: 든든한 간식을 원하는 학생"></div><div class="field"><label>한 줄 상품소개</label><input class="input" data-k="productLine" value="${esc(data.productLine)}" placeholder="맛과 특징을 한 줄로"></div></div><div class="field"><label>왜 이 판매가격으로 정했나요?</label><textarea data-k="priceReason">${esc(data.priceReason)}</textarea></div><div class="notice"><b>가격은 ‘누가 더 이익을 많이 냈는지’ 순위를 매기기 위한 것이 아닙니다.</b> 우리 조가 생각한 가치와 소비자가 살 만한 가격을 설명하는 활동입니다.</div><div class="field" style="margin-top:12px"><label>완성 사진 선택 (미리보기용)</label><input id="photo" class="input" type="file" accept="image/*"><img id="photoPreview" class="photo"><div class="muted">사진은 Padlet에 올릴 때 다시 첨부합니다. 이 웹은 사진파일 자체를 전송하지 않습니다.</div></div></div>`}
function page4(){return `<div class="card"><h2>④ 조별 경제회의</h2><div class="field"><label>오늘 직접 경험했다고 생각하는 경제개념</label>${checkList('concepts',CFG.concepts,data.concepts)}</div><div class="grid"><div class="field"><label>가장 잘한 경제적 선택은?</label><textarea data-k="bestChoice">${esc(data.bestChoice)}</textarea></div><div class="field"><label>가장 어려웠던 선택은?</label><textarea data-k="hardChoice">${esc(data.hardChoice)}</textarea></div></div><div class="field"><label>다시 경매한다면 무엇을 바꾸겠나요?</label><textarea data-k="nextStrategy">${esc(data.nextStrategy)}</textarea></div><div class="notice">선생님과 연결해 보기: <b>희소성 → 예산제약 → 선택 → 기회비용 → 경쟁과 가격형성 → 합리적 선택</b></div></div>`}
function page5(){const left=leftover(),total=allocTotal(),diff=left-total;return `<div class="card"><h2>⑤ 남은 가상예산도 선택입니다</h2><div class="money">남은 가상예산 ${money(left)}</div><p>실제 생활이라면 남은 돈을 어떻게 나누고 싶나요?</p><div class="grid"><div class="field"><label>추가 소비</label><input class="input alloc" type="number" data-k="consume" value="${data.consume}"></div><div class="field"><label>저축</label><input class="input alloc" type="number" data-k="save" value="${data.save}"></div><div class="field"><label>기부·나눔</label><input class="input alloc" type="number" data-k="donate" value="${data.donate}"></div><div class="field"><label>예비비</label><input class="input alloc" type="number" data-k="reserve" value="${data.reserve}"></div></div><div id="allocStatus" class="${diff===0?'success':'error'}">배분 합계 ${money(total)} · ${diff===0?'남은 예산과 일치합니다.':`차이 ${money(Math.abs(diff))}`}</div><div class="notice" style="margin-top:10px">돈을 많이 남긴 조가 무조건 더 잘한 것은 아닙니다. <b>우리 조의 목적에 맞게 왜 쓰고 왜 남겼는지 설명할 수 있는가</b>가 중요합니다.</div></div>`}
function page6(){if(!CFG.stickerEnabled)return `<div class="card"><h2>⑥ 스티커 피드백</h2><div class="notice">이번 수업에서는 스티커 활동을 사용하지 않습니다.</div></div>`;return `<div class="card"><h2>⑥ 샌드위치 전시 · 스티커 피드백</h2><div class="notice"><b>스티커는 우승을 뽑는 점수가 아닙니다.</b> 친구들이 어떤 특징에 반응했는지 보는 ‘소비자 선호 자료’입니다. 자기 조에는 붙이지 않습니다.</div><div class="grid3" style="margin-top:12px">${CFG.stickerCategories.map(x=>`<div class="miniCard"><b>${esc(x)}</b><input class="input sticker" type="number" min="0" data-cat="${esc(x)}" value="${Number(data.sticker[x]||0)}" style="margin-top:8px"><div class="muted">받은 스티커 수</div></div>`).join('')}</div><p class="muted">추천: 학생 1인당 항목별 스티커 1장, 자기 조 제외. ‘가장 많이 받은 조=최고’로 평가하지 않고 Padlet에서 반응 차이를 관찰합니다.</p></div>`}
function summaryText(){const left=leftover(),st=CFG.stickerEnabled?CFG.stickerCategories.map(x=>`${x} ${data.sticker[x]||0}개`).join(' / '):'미실시';return `🥪 ${team}조 · ${data.finalName||data.planName||'우리 조 샌드위치'}\n\n[경매 전 계획]\n원한 메인: ${data.wantedMain||'-'}\n원한 추가재료: ${data.wantedExtras.join(', ')||'-'}\n최대 입찰 한도: ${data.maxBid?money(data.maxBid):'-'}\n선택 이유: ${data.planReason||'-'}\n\n[경매 후 실제]\n실제 메인: ${data.actualMain||'-'}\n실제 추가재료: ${data.actualExtras.join(', ')||'-'}\n음료/업그레이드: ${data.drink||'없음'}\n총 낙찰 지출: ${money(data.spent)}\n남은 가상예산: ${money(left)}\n달라진 점: ${data.change||'-'}\n포기한 것: ${data.gaveUp||'-'}\n바꾼 이유: ${data.whyChange||'-'}\n\n[우리 조 상품]\n최종 이름: ${data.finalName||'-'}\n1개 판매가격: ${data.salePrice?money(data.salePrice):'-'}\n가격을 정한 이유: ${data.priceReason||'-'}\n대상 소비자: ${data.targetCustomer||'-'}\n한 줄 소개: ${data.productLine||'-'}\n\n[경제회의]\n경험한 개념: ${data.concepts.join(', ')||'-'}\n잘한 선택: ${data.bestChoice||'-'}\n어려웠던 선택: ${data.hardChoice||'-'}\n다시 한다면: ${data.nextStrategy||'-'}\n\n[남은 돈을 실제 생활이라면]\n추가 소비 ${money(data.consume)} / 저축 ${money(data.save)} / 기부·나눔 ${money(data.donate)} / 예비비 ${money(data.reserve)}\n\n[스티커 반응]\n${st}\n\n📷 완성 샌드위치 사진과 활동지를 함께 올립니다.`}
function page7(){return `<div class="card"><h2>⑦ Padlet에 우리 조 결과 공유</h2><div class="notice">1. 아래 내용을 복사합니다. 2. <b>Padlet 열기</b>를 누릅니다. 3. 완성사진과 활동지 사진을 첨부하고 복사한 내용을 붙여넣습니다.</div><div id="summary" class="summary" style="margin-top:12px">${esc(summaryText())}</div><div style="margin-top:10px"><button id="copySummary" class="btn">📋 Padlet 글 복사</button><button id="openPadlet" class="btn warn">🟪 Padlet 열기</button><button id="print" class="btn light">🖨 우리 조 기록 인쇄</button></div><div class="warnbox" style="margin-top:10px">사진과 활동지 파일은 웹에서 자동으로 Padlet에 전송되지 않습니다. Padlet에서 직접 첨부해 주세요.</div></div>`}
const pages=[page1,page2,page3,page4,page5,page6,page7];
function render(){if(Number(team)>CFG.teamCount)team='1';$('#title').textContent='🥪 '+CFG.classTitle;$('#budgetTop').textContent='조별 가상예산 '+money(CFG.teamBudget);$('#team').innerHTML=Array.from({length:CFG.teamCount},(_,i)=>`<option value="${i+1}" ${String(i+1)===String(team)?'selected':''}>${i+1}조</option>`).join('');stepDots();$('#page').innerHTML=pages[step]();$('#prev').disabled=step===0;$('#next').textContent=step===pages.length-1?'처음으로':'다음 →';bind()}
function updateSpentStatus(){const e=$('#leftoverAfterSpend');if(e)e.textContent=money(leftover())}function updateAllocStatus(){const e=$('#allocStatus');if(!e)return;const left=leftover(),total=allocTotal(),diff=left-total;e.className=diff===0?'success':'error';e.textContent=`배분 합계 ${money(total)} · ${diff===0?'남은 예산과 일치합니다.':`차이 ${money(Math.abs(diff))}`}`}function bind(){document.querySelectorAll('[data-k]').forEach(el=>{el.oninput=el.onchange=()=>{data[el.dataset.k]=el.value;save();if(el.dataset.k==='spent')updateSpentStatus();if(el.classList.contains('alloc'))updateAllocStatus()}});document.querySelectorAll('input[name="wantedExtras"]').forEach(x=>x.onchange=()=>{data.wantedExtras=[...document.querySelectorAll('input[name="wantedExtras"]:checked')].map(x=>x.value);save()});document.querySelectorAll('input[name="actualExtras"]').forEach(x=>x.onchange=()=>{data.actualExtras=[...document.querySelectorAll('input[name="actualExtras"]:checked')].map(x=>x.value);save()});document.querySelectorAll('input[name="concepts"]').forEach(x=>x.onchange=()=>{data.concepts=[...document.querySelectorAll('input[name="concepts"]:checked')].map(x=>x.value);save()});document.querySelectorAll('input[name="drink"]').forEach(x=>x.onchange=()=>{data.drink=x.value;save()});document.querySelectorAll('.sticker').forEach(x=>x.oninput=()=>{data.sticker[x.dataset.cat]=Math.max(0,+x.value||0);save()});const ph=$('#photo');if(ph)ph.onchange=e=>{const f=e.target.files[0];if(!f)return;data.photoName=f.name;save();const img=$('#photoPreview');img.src=URL.createObjectURL(f);img.style.display='block'};$('#copySummary')?.addEventListener('click',async()=>{const txt=summaryText();try{await navigator.clipboard.writeText(txt);$('#saveMsg').textContent='✅ Padlet 글 복사됨'}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}});$('#openPadlet')?.addEventListener('click',()=>{if(!CFG.padletUrl)return alert('선생님이 Padlet 주소를 설정하지 않았습니다.');window.open(CFG.padletUrl,'_blank')});$('#print')?.addEventListener('click',()=>window.print())}
$('#team').onchange=e=>{team=e.target.value;localStorage.setItem('padletEconomyTeamV1',team);data=load();step=0;render()};$('#prev').onclick=()=>{if(step>0)step--;render();scrollTo(0,0)};$('#next').onclick=()=>{if(step<pages.length-1)step++;else step=0;render();scrollTo(0,0)};render();
</script></body></html>
